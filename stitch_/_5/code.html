<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>物料管理 - 审批中心</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-container": "#fffbff",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#007f9d",
                    "surface-container": "#edeef0",
                    "primary-fixed": "#b7eaff",
                    "on-primary": "#ffffff",
                    "secondary-fixed-dim": "#b7c8e1",
                    "on-primary-container": "#fafdff",
                    "on-secondary-fixed-variant": "#38485d",
                    "on-tertiary-fixed": "#2d1600",
                    "surface-container-low": "#f3f4f6",
                    "on-primary-fixed-variant": "#004e61",
                    "surface-container-high": "#e7e8ea",
                    "surface": "#f8f9fb",
                    "surface-bright": "#f8f9fb",
                    "on-secondary-container": "#54647a",
                    "outline": "#6e797e",
                    "primary": "#00647c",
                    "on-secondary-fixed": "#0b1c30",
                    "on-error-container": "#93000a",
                    "outline-variant": "#bdc8ce",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#191c1e",
                    "on-secondary": "#ffffff",
                    "secondary-fixed": "#d3e4fe",
                    "primary-fixed-dim": "#6cd3f7",
                    "secondary-container": "#d0e1fb",
                    "inverse-on-surface": "#f0f1f3",
                    "secondary": "#505f76",
                    "tertiary-fixed": "#ffdcbf",
                    "surface-dim": "#d9dadc",
                    "on-primary-fixed": "#001f28",
                    "on-tertiary-fixed-variant": "#6a3b00",
                    "tertiary-container": "#a86516",
                    "inverse-surface": "#2e3132",
                    "error": "#ba1a1a",
                    "surface-variant": "#e1e2e4",
                    "tertiary-fixed-dim": "#ffb873",
                    "on-surface": "#191c1e",
                    "on-error": "#ffffff",
                    "inverse-primary": "#6cd3f7",
                    "surface-container-highest": "#e1e2e4",
                    "tertiary": "#894e00",
                    "error-container": "#ffdad6",
                    "surface-tint": "#006780",
                    "on-surface-variant": "#3e484d",
                    "background": "#f8f9fb"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "8px",
                    "xl": "32px",
                    "xs": "4px",
                    "unit": "4px",
                    "margin-mobile": "16px",
                    "md": "16px",
                    "margin-desktop": "32px",
                    "lg": "24px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "label-caps": ["Geist"],
                    "headline-md": ["Inter"],
                    "mono-data": ["Geist"],
                    "headline-md-mobile": ["Inter"],
                    "title-sm": ["Inter"],
                    "body-sm": ["Inter"],
                    "display-lg": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "mono-data": ["13px", {"lineHeight": "18px", "fontWeight": "500"}],
                    "headline-md-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "title-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .tab-active { position: relative; color: #00647c; font-weight: 600; }
        .tab-active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: #00647c; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        @keyframes toast-slide { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-animate { animation: toast-slide 0.3s ease-out forwards; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen pb-20">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-14 bg-surface dark:bg-background border-b border-outline-variant dark:border-outline">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container overflow-hidden">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-on-surface dark:text-on-background">物料管理</h1>
</div>
<div class="flex items-center">
<span class="font-label-caps text-label-caps px-2 py-1 rounded bg-primary-container text-on-primary-container">ADMIN</span>
</div>
</header>
<main class="pt-20 px-margin-mobile max-w-2xl mx-auto">
<!-- Tab Bar -->
<nav class="flex border-b border-outline-variant mb-6 sticky top-14 bg-surface z-40">
<button class="flex-1 py-3 text-center font-label-caps text-label-caps tab-active">待审批 <span class="bg-error text-on-error rounded-full px-1.5 py-0.5 text-[10px] ml-1">2</span></button>
<button class="flex-1 py-3 text-center font-label-caps text-label-caps text-on-surface-variant">已通过</button>
<button class="flex-1 py-3 text-center font-label-caps text-label-caps text-on-surface-variant">已拒绝</button>
<button class="flex-1 py-3 text-center font-label-caps text-label-caps text-on-surface-variant">全部</button>
</nav>
<!-- Approval List -->
<div class="space-y-4">
<!-- Card 1: 出库申请 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow">
<div class="flex justify-between items-start mb-3">
<div class="flex items-center gap-2">
<span class="bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded text-[12px] font-bold">出库申请</span>
<span class="text-on-surface-variant font-mono-data text-mono-data">#REQ-202308-001</span>
</div>
<span class="text-tertiary font-label-caps text-label-caps flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">schedule</span> 10分钟前
                    </span>
</div>
<div class="mb-4">
<h3 class="font-title-sm text-title-sm mb-1">DJI M350 电机</h3>
<p class="text-on-surface-variant font-body-sm text-body-sm flex justify-between">
<span>数量: <span class="font-mono-data font-bold text-on-surface">2</span></span>
<span>申请人: <span class="text-on-surface">王五</span></span>
</p>
<div class="mt-2 bg-surface-container-low rounded p-2 border-l-4 border-primary">
<p class="text-on-surface-variant font-body-sm text-body-sm italic">"项目组测试领用"</p>
</div>
</div>
<div class="flex gap-3">
<button class="flex-1 bg-primary text-on-primary py-2.5 rounded-lg font-label-caps text-label-caps flex items-center justify-center gap-2 active:scale-95 transition-transform" onclick="showToast()">
<span class="material-symbols-outlined text-[18px]">check_circle</span> 通过
                    </button>
<button class="flex-1 border border-outline text-on-surface-variant py-2.5 rounded-lg font-label-caps text-label-caps flex items-center justify-center gap-2 active:scale-95 transition-transform" onclick="openRejectModal()">
<span class="material-symbols-outlined text-[18px]">cancel</span> 拒绝
                    </button>
</div>
</div>
<!-- Card 2: 入库申请 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow">
<div class="flex justify-between items-start mb-3">
<div class="flex items-center gap-2">
<span class="bg-primary-container text-on-primary-container px-2 py-0.5 rounded text-[12px] font-bold">入库申请</span>
<span class="text-on-surface-variant font-mono-data text-mono-data">#REC-202308-042</span>
</div>
<span class="text-on-surface-variant font-label-caps text-label-caps flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">schedule</span> 1小时前
                    </span>
</div>
<div class="mb-4">
<h3 class="font-title-sm text-title-sm mb-1">螺丝螺栓</h3>
<p class="text-on-surface-variant font-body-sm text-body-sm flex justify-between">
<span>数量: <span class="font-mono-data font-bold text-on-surface">100</span></span>
<span>申请人: <span class="text-on-surface">赵六</span></span>
</p>
</div>
<div class="flex gap-3">
<button class="flex-1 bg-primary text-on-primary py-2.5 rounded-lg font-label-caps text-label-caps flex items-center justify-center gap-2 active:scale-95 transition-transform" onclick="showToast()">
<span class="material-symbols-outlined text-[18px]">check_circle</span> 通过
                    </button>
<button class="flex-1 border border-outline text-on-surface-variant py-2.5 rounded-lg font-label-caps text-label-caps flex items-center justify-center gap-2 active:scale-95 transition-transform" onclick="openRejectModal()">
<span class="material-symbols-outlined text-[18px]">cancel</span> 拒绝
                    </button>
</div>
</div>
</div>
<!-- Empty State Preview (Hidden) -->
<div class="hidden flex-col items-center justify-center py-20 opacity-40">
<span class="material-symbols-outlined text-[64px] mb-4 text-outline">inbox</span>
<p class="font-body-md text-body-md">暂无待审批事项</p>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe h-16 bg-surface-container-lowest dark:bg-surface-dim shadow-md rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-secondary-fixed-variant hover:bg-surface-container-high px-4 py-1">
<span class="material-symbols-outlined">search</span>
<span class="font-label-caps text-label-caps">搜索</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-secondary-fixed-variant hover:bg-surface-container-high px-4 py-1">
<span class="material-symbols-outlined">add_box</span>
<span class="font-label-caps text-label-caps">入库</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-secondary-fixed-variant hover:bg-surface-container-high px-4 py-1">
<span class="material-symbols-outlined">outbox</span>
<span class="font-label-caps text-label-caps">出库</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full px-4 py-1 scale-90">
<span class="material-symbols-outlined">history</span>
<span class="font-label-caps text-label-caps">历史</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-secondary-fixed-variant hover:bg-surface-container-high px-4 py-1">
<span class="material-symbols-outlined">more_horiz</span>
<span class="font-label-caps text-label-caps">更多</span>
</button>
</nav>
<!-- Modal: Rejection Pop-up -->
<div class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4" id="rejectModal">
<div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeRejectModal()"></div>
<div class="relative w-full max-w-sm bg-surface-container-lowest rounded-2xl shadow-2xl overflow-hidden border border-outline-variant">
<div class="p-6">
<div class="flex items-center gap-3 mb-4 text-error">
<span class="material-symbols-outlined">error</span>
<h2 class="font-title-sm text-title-sm">拒绝申请</h2>
</div>
<div class="space-y-4">
<div>
<label class="block font-label-caps text-label-caps mb-1.5 text-on-surface-variant">拒绝原因</label>
<textarea class="w-full rounded-lg border-outline-variant focus:ring-primary focus:border-primary font-body-sm text-body-sm bg-surface p-3" placeholder="请输入具体原因，例如：信息填写错误..." rows="3"></textarea>
</div>
</div>
<div class="flex gap-3 mt-6">
<button class="flex-1 py-2.5 font-label-caps text-label-caps border border-outline rounded-lg hover:bg-surface-container-low transition-colors" onclick="closeRejectModal()">取消</button>
<button class="flex-1 py-2.5 font-label-caps text-label-caps bg-error text-on-error rounded-lg hover:brightness-110 active:scale-95 transition-all" onclick="confirmReject()">确认拒绝</button>
</div>
</div>
</div>
</div>
<!-- Toast Success -->
<div class="hidden fixed bottom-24 left-1/2 -translate-x-1/2 z-[110] w-[calc(100%-32px)] max-w-md" id="successToast">
<div class="toast-animate bg-inverse-surface text-inverse-on-surface px-4 py-3 rounded-xl shadow-lg flex items-center gap-3">
<span class="material-symbols-outlined text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-sm text-body-sm">审批通过，库存已自动更新</span>
</div>
</div>
<script>
        function openRejectModal() {
            const modal = document.getElementById('rejectModal');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeRejectModal() {
            const modal = document.getElementById('rejectModal');
            modal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        function confirmReject() {
            closeRejectModal();
            // Simplified logic: just hide modal for demo
        }

        function showToast() {
            const toast = document.getElementById('successToast');
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
</body></html>
