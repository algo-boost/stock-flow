<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>物料入库 - 管理系统</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-tertiary-container": "#fffbff",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#007f9d",
                    "surface-container": "#edeef0",
                    "primary-fixed": "#b7eaff",
                    "on-primary": "#ffffff",
                    "secondary-fixed-dim": "#b7c8e1",
                    "on-primary-container": "#fafdff",
                    "on-secondary-fixed-variant": "#38485d",
                    "on-tertiary-fixed": "#2d1600",
                    "surface-container-low": "#f3f4f6",
                    "on-primary-fixed-variant": "#004e61",
                    "surface-container-high": "#e7e8ea",
                    "surface": "#f8f9fb",
                    "surface-bright": "#f8f9fb",
                    "on-secondary-container": "#54647a",
                    "outline": "#6e797e",
                    "primary": "#00647c",
                    "on-secondary-fixed": "#0b1c30",
                    "on-error-container": "#93000a",
                    "outline-variant": "#bdc8ce",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#191c1e",
                    "on-secondary": "#ffffff",
                    "secondary-fixed": "#d3e4fe",
                    "primary-fixed-dim": "#6cd3f7",
                    "secondary-container": "#d0e1fb",
                    "inverse-on-surface": "#f0f1f3",
                    "secondary": "#505f76",
                    "tertiary-fixed": "#ffdcbf",
                    "surface-dim": "#d9dadc",
                    "on-primary-fixed": "#001f28",
                    "on-tertiary-fixed-variant": "#6a3b00",
                    "tertiary-container": "#a86516",
                    "inverse-surface": "#2e3132",
                    "error": "#ba1a1a",
                    "surface-variant": "#e1e2e4",
                    "tertiary-fixed-dim": "#ffb873",
                    "on-surface": "#191c1e",
                    "on-error": "#ffffff",
                    "inverse-primary": "#6cd3f7",
                    "surface-container-highest": "#e1e2e4",
                    "tertiary": "#894e00",
                    "error-container": "#ffdad6",
                    "surface-tint": "#006780",
                    "on-surface-variant": "#3e484d",
                    "background": "#f8f9fb"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "8px",
                    "xl": "32px",
                    "xs": "4px",
                    "unit": "4px",
                    "margin-mobile": "16px",
                    "md": "16px",
                    "margin-desktop": "32px",
                    "lg": "24px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "label-caps": ["Geist"],
                    "headline-md": ["Inter"],
                    "mono-data": ["Geist"],
                    "headline-md-mobile": ["Inter"],
                    "title-sm": ["Inter"],
                    "body-sm": ["Inter"],
                    "display-lg": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "mono-data": ["13px", {"lineHeight": "18px", "fontWeight": "500"}],
                    "headline-md-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "title-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            user-select: none;
        }
        .active-scale:active { transform: scale(0.95); }
        .success-toast {
            animation: slideUpFade 0.4s ease-out forwards;
        }
        @keyframes slideUpFade {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-14 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-secondary-container text-[20px]">person</span>
</div>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-on-surface">物料管理</h1>
</div>
<div class="flex items-center gap-2">
<span class="font-label-caps text-label-caps px-2 py-0.5 bg-primary-container text-on-primary-container rounded">ADMIN</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 px-margin-mobile max-w-xl mx-auto">
<div class="flex items-center justify-between mb-lg">
<h2 class="font-headline-md-mobile text-headline-md-mobile text-on-surface">物料入库</h2>
<button class="flex items-center gap-1 text-primary font-label-caps text-label-caps active-scale">
<span class="material-symbols-outlined text-[18px]">add_circle</span>
                快速新增物料
            </button>
</div>
<!-- Form Section -->
<div class="space-y-lg">
<!-- Step 1: Material Selection -->
<section class="bg-surface-container-lowest p-md rounded-xl border border-outline-variant shadow-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs">选择物料</label>
<div class="relative">
<div class="w-full h-12 px-4 flex items-center justify-between bg-surface-container rounded-lg border border-outline-variant">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">inventory_2</span>
<span class="font-body-md text-on-surface">DJI M350 电机</span>
</div>
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
</section>
<!-- Step 2: Location -->
<section class="bg-surface-container-lowest p-md rounded-xl border border-outline-variant shadow-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs">存储位置</label>
<select class="w-full h-12 px-4 bg-white rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none appearance-none font-body-md">
<option>A-01</option>
<option>B-02</option>
<option selected="">快递暂存</option>
</select>
</section>
<!-- Step 3: Quantity -->
<section class="bg-surface-container-lowest p-md rounded-xl border border-outline-variant shadow-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs">入库数量</label>
<div class="flex items-center gap-4">
<button class="w-12 h-12 flex items-center justify-center bg-surface-container-high rounded-lg active-scale" id="dec-btn">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="flex-1 h-12 text-center bg-white border border-outline-variant rounded-lg font-mono-data text-title-sm focus:border-primary outline-none" id="qty-input" type="number" value="1"/>
<button class="w-12 h-12 flex items-center justify-center bg-primary text-on-primary rounded-lg active-scale" id="inc-btn">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</section>
<!-- Step 4: Type Selection -->
<section class="bg-surface-container-lowest p-md rounded-xl border border-outline-variant shadow-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-md">入库类型</label>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-outline-variant font-body-sm text-on-surface-variant hover:bg-surface-container active-scale transition-colors">采购入库</button>
<button class="px-4 py-2 rounded-full border border-outline-variant font-body-sm text-on-surface-variant hover:bg-surface-container active-scale transition-colors">归还入库</button>
<button class="px-4 py-2 rounded-full bg-secondary-container text-on-secondary-container font-body-sm border border-secondary-container active-scale">快递暂存</button>
<button class="px-4 py-2 rounded-full border border-outline-variant font-body-sm text-on-surface-variant hover:bg-surface-container active-scale transition-colors">盘点调整</button>
</div>
</section>
<!-- Step 5: Remark -->
<section class="bg-surface-container-lowest p-md rounded-xl border border-outline-variant shadow-sm">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-xs">备注信息</label>
<textarea class="w-full p-3 bg-white border border-outline-variant rounded-lg font-body-sm focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none" placeholder="添加备注..." rows="3"></textarea>
</section>
</div>
</main>
<!-- Floating Submit Action -->
<div class="fixed bottom-20 left-0 w-full px-margin-mobile z-40">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-title-sm flex items-center justify-center gap-2 shadow-xl active:scale-95 transition-transform duration-150" id="submit-btn">
<span class="material-symbols-outlined">done_all</span>
            确认提交入库
        </button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe h-16 bg-surface-container-lowest rounded-t-xl shadow-md">
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors px-4 py-1">
<span class="material-symbols-outlined">search</span>
<span class="font-label-caps text-label-caps">搜索</span>
</div>
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 scale-90 duration-150">
<span class="material-symbols-outlined">add_box</span>
<span class="font-label-caps text-label-caps">入库</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors px-4 py-1">
<span class="material-symbols-outlined">outbox</span>
<span class="font-label-caps text-label-caps">出库</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors px-4 py-1">
<span class="material-symbols-outlined">history</span>
<span class="font-label-caps text-label-caps">历史</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-colors px-4 py-1">
<span class="material-symbols-outlined">more_horiz</span>
<span class="font-label-caps text-label-caps">更多</span>
</div>
</nav>
<!-- Success Toast Overlay (Hidden by default) -->
<div class="hidden fixed inset-0 z-[100] flex items-center justify-center px-8 bg-black/20 backdrop-blur-[2px]" id="success-toast">
<div class="success-toast bg-white p-6 rounded-2xl shadow-2xl flex flex-col items-center gap-4 text-center">
<div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div>
<h3 class="font-title-sm text-title-sm text-on-surface">入库成功</h3>
<p class="font-body-sm text-on-surface-variant mt-1">库存已实时更新并同步至云端</p>
</div>
<button class="mt-2 px-8 py-2 bg-primary text-on-primary rounded-lg font-label-caps text-label-caps" onclick="hideToast()">确定</button>
</div>
</div>
<script>
        const qtyInput = document.getElementById('qty-input');
        const incBtn = document.getElementById('inc-btn');
        const decBtn = document.getElementById('dec-btn');
        const submitBtn = document.getElementById('submit-btn');
        const toast = document.getElementById('success-toast');

        incBtn.addEventListener('click', () => {
            qtyInput.value = parseInt(qtyInput.value) + 1;
        });

        decBtn.addEventListener('click', () => {
            if(parseInt(qtyInput.value) > 1) {
                qtyInput.value = parseInt(qtyInput.value) - 1;
            }
        });

        submitBtn.addEventListener('click', () => {
            toast.classList.remove('hidden');
            // Mock interaction haptic
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        });

        function hideToast() {
            toast.classList.add('hidden');
            window.location.reload(); // Reset state for simulation
        }
    </script>
</body></html>
