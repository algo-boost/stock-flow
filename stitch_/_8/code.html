<script>
        function switchTab(tab) {
            const btnApply = document.getElementById('tab-apply');
            const btnFlow = document.getElementById('tab-flow');
            const contentApply = document.getElementById('content-apply');
            const contentFlow = document.getElementById('content-flow');

            if (tab === 'apply') {
                btnApply.classList.add('text-primary', 'tab-active');
                btnApply.classList.remove('text-on-surface-variant');
                btnFlow.classList.remove('text-primary', 'tab-active');
                btnFlow.classList.add('text-on-surface-variant');
                contentApply.classList.remove('hidden');
                contentFlow.classList.add('hidden');
            } else {
                btnFlow.classList.add('text-primary', 'tab-active');
                btnFlow.classList.remove('text-on-surface-variant');
                btnApply.classList.remove('text-primary', 'tab-active');
                btnApply.classList.add('text-on-surface-variant');
                contentFlow.classList.remove('hidden');
                contentApply.classList.add('hidden');
            }
        }
    </script>
