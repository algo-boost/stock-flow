<!DOCTYPE html>

<html lang="zh-CN"><head>

                        "outline": "#6e797e",

                        "on-secondary-fixed": "#0b1c30",
                        "on-error-container": "#93000a",

                        "inverse-on-surface": "#f0f1f3",
                        "secondary": "#505f76",
                        "tertiary-fixed": "#ffdcbf",

                        "on-primary-fixed": "#001f28",
                        "on-tertiary-fixed-variant": "#6a3b00",
                        "tertiary-container": "#a86516",
                        "inverse-surface": "#2e3132",
                        "error": "#ba1a1a",
                        "surface-variant": "#e1e2e4",
                        "tertiary-fixed-dim": "#ffb873",
                        "on-surface": "#191c1e",
                        "on-error": "#ffffff",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #f3f4f6; /* Level 0 Base */
            font-family: 'Inter', sans-serif;
        }
        .tooltip {
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }
        .group:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-14 bg-surface border-b border-outline-variant">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-secondary-container" style="font-size: 20px;">account_circle</span>
</div>
<h1 class="font-headline-md-mobile text-headline-md-mobile font-bold text-on-surface">库位管理</h1>
</div>
<div class="px-3 py-1 rounded bg-primary-container text-white font-label-caps text-label-caps">
            ADMIN
        </div>
</header>
<main class="pt-20 pb-24 px-margin-mobile max-w-3xl mx-auto min-h-screen">
<!-- Search Section -->
<section class="mb-6">
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-xl focus:border-primary focus:ring-1 focus:ring-primary transition-all font-body-md text-on-surface outline-none" id="searchInput" placeholder="搜索库位名称、编号或区域..." type="text"/>
</div>
</section>
<!-- Location List (Bento-ish Grid) -->
<div class="space-y-4" id="location-list">
<!-- Row 1: Stocked -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow flex flex-col gap-3 group">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-mono-data text-label-caps text-primary bg-primary-container/10 px-2 py-0.5 rounded w-fit mb-1">A-01</span>
<h3 class="font-title-sm text-title-sm text-on-surface">零件货柜-1</h3>
</div>
<div class="flex items-center gap-2">
<button class="p-2 hover:bg-surface-container rounded-full text-secondary transition-colors">
<span class="material-symbols-outlined">edit</span>
</button>
<div class="relative group">
<button class="p-2 text-outline-variant cursor-not-allowed" disabled="">
<span class="material-symbols-outlined">delete</span>
</button>
<!-- Tooltip -->
<div class="tooltip absolute bottom-full right-0 mb-2 px-3 py-1 bg-inverse-surface text-inverse-on-surface text-xs rounded-lg whitespace-nowrap shadow-lg">
                                有库存不可删除
                            </div>
</div>
</div>
</div>
<div class="grid grid-cols-2 gap-4 border-t border-outline-variant/30 pt-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[18px]">category</span>
<span class="text-body-sm text-on-surface-variant">货柜</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[18px]">location_on</span>
<span class="text-body-sm text-on-surface-variant">实验室西区</span>
</div>
</div>
<div class="flex items-center justify-between mt-1">
<div class="flex items-center gap-2">
<div class="h-2 w-24 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-primary w-[75%]"></div>
</div>
<span class="font-mono-data text-body-sm text-on-surface">150 PCS</span>
</div>
<span class="px-2 py-1 bg-tertiary-fixed text-on-tertiary-fixed-variant font-label-caps text-[10px] rounded uppercase">In Stock</span>
</div>
</div>
<!-- Row 2: Empty -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-4 shadow-sm hover:shadow-md transition-shadow flex flex-col gap-3">
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="font-mono-data text-label-caps text-secondary bg-secondary-container/30 px-2 py-0.5 rounded w-fit mb-1">TEMP-01</span>
<h3 class="font-title-sm text-title-sm text-on-surface">快递暂存架</h3>
</div>
<div class="flex items-center gap-2">
<button class="p-2 hover:bg-surface-container rounded-full text-secondary transition-colors">
<span class="material-symbols-outlined">edit</span>
</button>
<button class="p-2 hover:bg-error/10 hover:text-error rounded-full text-secondary transition-colors">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
<div class="grid grid-cols-2 gap-4 border-t border-outline-variant/30 pt-3">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[18px]">local_shipping</span>
<span class="text-body-sm text-on-surface-variant">快递暂存</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[18px]">sensor_door</span>
<span class="text-body-sm text-on-surface-variant">门口</span>
</div>
</div>
<div class="flex items-center justify-between mt-1">
<div class="flex items-center gap-2">
<div class="h-2 w-24 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-outline-variant w-[0%]"></div>
</div>
<span class="font-mono-data text-body-sm text-outline">0 PCS</span>
</div>
<span class="px-2 py-1 bg-surface-variant text-on-surface-variant font-label-caps text-[10px] rounded uppercase">Available</span>
</div>
</div>
<!-- Empty State (Hidden by default) -->
<div class="hidden flex flex-col items-center justify-center py-20 text-center" id="empty-state">
<div class="w-48 h-48 mb-6 relative">
<div class="absolute inset-0 bg-secondary-container/20 rounded-full blur-3xl"></div>
<!-- Mock Illustration for Empty Search -->
<div class="relative w-full h-full flex items-center justify-center">
<span class="material-symbols-outlined text-[80px] text-outline-variant">inventory_2</span>
<span class="material-symbols-outlined absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[40px] text-primary" style="font-variation-settings: 'FILL' 1;">search</span>
</div>
</div>
<h4 class="font-title-sm text-title-sm text-on-surface mb-2">暂无搜索结果</h4>
<p class="text-body-sm text-on-surface-variant max-w-xs mx-auto">未找到匹配的库位信息，请检查搜索词或添加新库位。</p>
<button class="mt-6 px-6 py-2 border border-primary text-primary font-label-caps text-label-caps rounded-full hover:bg-primary/5 transition-colors">
                    重置搜索
                </button>
</div>
</div>
</main>
<!-- Floating Action Button -->
<button class="fixed bottom-24 right-6 w-14 h-14 bg-primary text-white rounded-2xl shadow-xl hover:scale-105 active:scale-95 transition-all flex items-center justify-center z-50">
<span class="material-symbols-outlined text-[28px]">add</span>
</button>
<!-- Bottom Nav Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-safe h-16 bg-surface-container-lowest shadow-md rounded-t-xl">
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">search</span>
<span class="font-label-caps text-label-caps">搜索</span>
</div>
<!-- Active Tab: "入库" or custom logic - here mapped for semantic flow -->
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 active:scale-90 duration-150">
<span class="material-symbols-outlined">add_box</span>
<span class="font-label-caps text-label-caps">入库</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">outbox</span>
<span class="font-label-caps text-label-caps">出库</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">history</span>
<span class="font-label-caps text-label-caps">历史</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">more_horiz</span>
<span class="font-label-caps text-label-caps">更多</span>
</div>
</nav>
<script>
        const searchInput = document.getElementById('searchInput');
        const emptyState = document.getElementById('empty-state');
        const cards = document.querySelectorAll('#location-list > .bg-surface-container-lowest');

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            let hasResults = false;

            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                if (text.includes(val)) {
                    card.classList.remove('hidden');
                    hasResults = true;
                } else {
                    card.classList.add('hidden');
                }
            });

            if (hasResults) {
                emptyState.classList.add('hidden');
            } else {
                emptyState.classList.remove('hidden');
            }
        });

        // Micro-interaction for FAB
        const fab = document.querySelector('button.fixed.bottom-24');
        fab.addEventListener('click', () => {
            fab.classList.add('scale-95');
            setTimeout(() => fab.classList.remove('scale-95'), 150);
        });
    </script>
</body></html>
